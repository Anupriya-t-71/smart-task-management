- name: Setup Kubernetes
  hosts: k8s
  become: yes
 
  tasks:
 
    - name: Install required packages
      apt:
        name:
          - containerd
          - curl
          - gpg
        state: present
        update_cache: yes
 
    - name: Configure containerd
      shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i "s/SystemdCgroup = false/SystemdCgroup = true/" /etc/containerd/config.toml
 
    - name: Configure Harbor HTTP registry for containerd
      shell: |
        mkdir -p /etc/containerd/certs.d/13.201.94.18:8090
 
        tee /etc/containerd/certs.d/13.201.94.18:8090/hosts.toml > /dev/null <<'EOF'
        server = "http://13.201.94.18:8090"
 
        [host."http://13.201.94.18:8090"]
          capabilities = ["pull", "resolve"]
        EOF
 
        sed -i "/\[plugins.'io.containerd.cri.v1.images'.registry\]/,/^\[/ s|config_path = ''|config_path = '/etc/containerd/certs.d'|" /etc/containerd/config.toml
 
        systemctl restart containerd
 
    - name: Enable IP forwarding
      shell: |
        echo "net.ipv4.ip_forward = 1" > /etc/sysctl.d/k8s.conf
        sysctl --system
 
    - name: Add Kubernetes repository key
      shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key | \
        gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes.gpg
 
    - name: Add Kubernetes repository
      copy:
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes.gpg] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /\n"
        dest: /etc/apt/sources.list.d/kubernetes.list
 
    - name: Install Kubernetes packages
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes
 
    - name: Hold Kubernetes packages
      shell: |
        apt-mark hold kubelet kubeadm kubectl
 
    - name: Initialize Kubernetes cluster
      command: kubeadm init
      args:
        creates: /etc/kubernetes/admin.conf
 
    - name: Create kubeconfig directory
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
 
    - name: Configure kubectl
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0600'
 
    - name: Create Harbor image pull secret
      become_user: ubuntu
      shell: |
        kubectl create secret docker-registry harbor-secret \
          --docker-server=13.201.94.18:8090 \
          --docker-username=admin \
          --docker-password='Harbor12345' \
          --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
 
    - name: Install Calico CNI
      become_user: ubuntu
      command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/calico.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
 
    - name: Allow workloads on control-plane
      become_user: ubuntu
      command: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      failed_when: false

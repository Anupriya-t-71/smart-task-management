services:
 mongodb: 
  image: mongo:4.4
  container_name: mongo
  ports:
   - "27017"

 auth-service:
  build: ./auth-service_1784011000189
  image: 3.110.188.102:8090/backend/auth-service
  ports:
   - "5001:5001"
  environment:
   MONGO_URI: mongodb://mongodb:27017/authdb
   JWT_SECRET: change_me
   JWT_EXPIRES_IN: 1h
  depends_on:
   - mongodb

 report-service:
  build: ./report-service
  image: 3.110.188.102:8090/backend/report-service
  ports:
   - "5004:5004"
  environment:
   MONGO_URI: mongodb://mongodb:27017/reportdb
   JWT_SECRET: change_me
  depends_on:
   - mongodb

 task-service:
  build: ./task-service
  image: 3.110.188.102:8090/backend/task-service
  ports:
   - "5002:5002"
  environment:
   MONGO_URI: mongodb://mongodb:27017/taskdb
   JWT_SECRET: change_me
  depends_on:
   - mongodb 

 notification-service:
  build: ./notification-service
  image: 3.110.188.102:8090/backend/notification-service
  ports:
   - "5003:5003"
  environment:
   MONGO_URI: mongodb://mongodb:27017/notificationdb
   JWT_SECRET: change_me
  depends_on:
   - mongodb   

 api-gateway:
  build: ./api-gateway_1784010924579
  image: 3.110.188.102:8090/backend/api-gateway
  environment:
   PORT: 5000
   AUTH_SERVICE_URL: http://auth-service:5001
   TASK_SERVICE_URL: http://task-service:5002
   JWT_SECRET: change_me
  depends_on:
   - mongodb  
   - auth-service
   - report-service
   - task-service
   - notification-service 
     

services:

  mongodb:
    image: mongo:4.4
    container_name: mongodb
    ports:
      - "27017:27017"

  auth-service:
    build: ./auth-service_1784011000189
    container_name: auth-service
    ports:
      - "5001:5001"
    environment:
      MONGO_URI: mongodb://mongodb:27017/authdb
      JWT_SECRET: Change_me
      JWT_EXPIRES_IN: 1h
    depends_on:
      - mongodb


  task-service:
    build: ./task-service
    container_name: task-service
    ports:
      - "5002:5002"
    environment:
      MONGO_URI: mongodb://mongodb:27017/taskdb
      JWT_SECRET: Change_me
    depends_on: 
      - mongodb  

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "5003:5003"
    environment:
      MONGO_URI: mongodb://mongodb:27017/notificationdb
      JWT_SECRET: Change_me
    depends_on: 
      - mongodb

  report-service:
    build: ./report-service
    container_name: report-service
    ports:
      - "5004:5004"
    environment:
      MONGO_URI: mongodb://mongodb:27017/reportdb
      JWT_SECRET: Change_me
    depends_on: 
      - mongodb

  api-gateway:
    build: ./api-gateway_1784010924579
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      AUTH_SERVICE_URL: http://auth-service:5001
      TASK_SERVICE_URL: http://task-service:5002
      JWT_SECRET: Change_me
    depends_on:
      - auth-service
      - task-service
      - notification-service
      - report-service    

          


        

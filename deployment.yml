apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  ports:
    - port: 27017
  selector:
    app: mongodb
 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:4.4
 
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  ports:
    - containerPort: 5001
      hostPort: 5001
  selector:
    app: auth-service
 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 13.201.28.198:8090/smart-task/auth-service
          env:
            - name: MONGO_URI
              value: mongodb://mongodb:27017/authdb
            - name: JWT_SECRET
              value: Change_me
 

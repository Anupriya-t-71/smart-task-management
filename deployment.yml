---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  ports:
    - containerPort: 5000
      hostPort: 5000
  selector:
    app: api-gateway
 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 13.201.28.198:8090/smart-task/api-gateway
          env:
            - name: PORT
              value: "5000"
            - name: AUTH_SERVICE_URL
              value: http://auth-service:5001
            - name: TASK_SERVICE_URL
              value: http://task-service:5002
            - name: JWT_SECRET
              value: Change_me

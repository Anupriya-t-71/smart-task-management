- name: Install Harbor
  hosts: harbor
  become: yes
 
  tasks:
    - name: Install Docker and Compose
      apt:
        update_cache: yes
        name:
          - docker.io
          - docker-compose-v2
          - wget
        state: present
 
    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes
 
    - name: Download Harbor
      get_url:
        url: https://github.com/goharbor/harbor/releases/download/v2.14.0/harbor-online-installer-v2.14.0.tgz
        dest: /tmp/harbor.tgz
 
    - name: Extract Harbor
      unarchive:
        src: /tmp/harbor.tgz
        dest: /opt
        remote_src: yes
 
    - name: Set Harbor hostname
      replace:
        path: /opt/harbor/harbor.yml.tmpl
        regexp: '^hostname:.*'
        replace: 'hostname: 13.201.94.18'
 
    - name: Set Harbor HTTP port
      replace:
        path: /opt/harbor/harbor.yml.tmpl
        regexp: '^  port: 80'
        replace: '  port: 8090'

    - name: Create Harbor configuration
      copy:
        src: /opt/harbor/harbor.yml.tmpl
        dest: /opt/harbor/harbor.yml
        remote_src: yes    

    - name: Disable Harbor https
      replace: 
        path: /opt/harbor/harbor.yml
        regexp: '^(\s*)https:'
        replace: '\1#https:' 

    - name: Disable Harbor port
      replace: 
        path: /opt/harbor/harbor.yml
        regexp: '^(\s*)port: 443$'
        replace: '\1#port: 443' 

    - name: Disable Harbor certificate
      replace: 
        path: /opt/harbor/harbor.yml
        regexp: '^(\s*)certificate:'
        replace: '\1#certificate:' 

    - name: Disable Harbor private_key
      replace: 
        path: /opt/harbor/harbor.yml
        regexp: '^(\s*)private_key:'
        replace: '\1#private_key:' 
               
    - name: Stop Harbor
      command: docker compose down
      args:
        chdir: /opt/harbor
      failed_when: false
 
    - name: Prepare Harbor
      command: ./prepare
      args:
        chdir: /opt/harbor    
 
    - name: Install Harbor
      command: ./install.sh
      args:
        chdir: /opt/harbor
